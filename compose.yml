name: gibyeol-dev

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${DEV_FRONTEND_PORT:-3001}:3000"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules
      - frontend_workspace_node_modules:/workspace/frontend/node_modules
      - protocol_node_modules:/workspace/packages/protocol/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-31337}
      NEXT_PUBLIC_WEB_ORIGIN: ${DEV_WEB_ORIGIN:-http://localhost:3001}
      NEXT_PUBLIC_RPC_URL: ${DEV_NEXT_PUBLIC_RPC_URL:-http://localhost:8546}
      NEXT_PUBLIC_API_BASE_URL: ${DEV_NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081/api/v1}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      NEXT_PUBLIC_GIBYEOL_CONTRACT_ADDRESS: ${NEXT_PUBLIC_GIBYEOL_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
      NEXT_PUBLIC_DEPLOYMENT_BLOCK: ${NEXT_PUBLIC_DEPLOYMENT_BLOCK:-0}
    command: pnpm --filter @gibyeol/frontend exec next dev --hostname 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  storybook:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${DEV_STORYBOOK_PORT:-6007}:6006"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules
      - frontend_workspace_node_modules:/workspace/frontend/node_modules
      - protocol_node_modules:/workspace/packages/protocol/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: 1
      STORYBOOK_DISABLE_TELEMETRY: 1
    command: pnpm --filter @gibyeol/frontend storybook
    restart: unless-stopped

  backend:
    image: gibyeol-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${DEV_BACKEND_PORT:-8081}:80"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
      - package_storage:/var/lib/gibyeol/packages
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-change_me_for_local_development}
      DATABASE_URL: mysql://${MYSQL_USER:-gibyeol}:${MYSQL_PASSWORD:-gibyeol_password}@db:3306/${MYSQL_DATABASE:-gibyeol}?serverVersion=8.4.0&charset=utf8mb4
      CHAIN_ID: ${CHAIN_ID:-31337}
      BASE_RPC_URL: ${BASE_RPC_URL:-http://anvil:8545}
      BASE_RPC_FALLBACK_URL: ${BASE_RPC_FALLBACK_URL:-}
      WEB_ORIGIN: ${DEV_WEB_ORIGIN:-http://localhost:3001}
      API_ORIGIN: ${DEV_API_ORIGIN:-http://localhost:8081}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gibyeol_session}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      EMAIL_LOOKUP_KEY: ${EMAIL_LOOKUP_KEY:-dev_lookup_key_change_me}
      OTP_HMAC_KEY: ${OTP_HMAC_KEY:-dev_otp_key_change_me}
      RECOVERY_PRIVATE_KEY: ${RECOVERY_PRIVATE_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      GIBYEOL_CONTRACT_ADDRESS: ${GIBYEOL_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
      UNLOCK_AT: ${UNLOCK_AT:-1798124400}
      CONTRACT_DEPLOYMENT_BLOCK: ${CONTRACT_DEPLOYMENT_BLOCK:-0}
      SAFE_BLOCK_CONFIRMATIONS: ${SAFE_BLOCK_CONFIRMATIONS:-0}
      ORPHAN_MIN_AGE_SECONDS: ${ORPHAN_MIN_AGE_SECONDS:-259200}
      PACKAGE_STORAGE_PATH: /var/lib/gibyeol/packages
      DEFAULT_URI: ${DEV_API_ORIGIN:-http://localhost:8081}
      LOCK_DSN: flock
    depends_on:
      db:
        condition: service_healthy
      anvil:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/api/v1/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  db:
    image: mysql:8.4
    ports:
      - "${DEV_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gibyeol}
      MYSQL_USER: ${MYSQL_USER:-gibyeol}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gibyeol_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "${DEV_ANVIL_PORT:-8546}:8545"
    restart: unless-stopped

  contracts:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./contracts:/workspace
      - foundry_home:/home/foundry
    entrypoint: ["forge"]
    command: ["--version"]

volumes:
  mysql_data:
  frontend_node_modules:
  frontend_workspace_node_modules:
  protocol_node_modules:
  backend_vendor:
  backend_var:
  package_storage:
  foundry_home:
