framework:
  secret: '%env(APP_SECRET)%'
  http_method_override: false
  handle_all_throwables: true
  session:
    handler_id: null
    cookie_secure: auto
    cookie_httponly: true
    cookie_samesite: lax
  router:
    utf8: true
  php_errors:
    log: true
  rate_limiter:
    auth_challenge:
      policy: sliding_window
      limit: 10
      interval: '1 minute'
    auth_verify:
      policy: sliding_window
      limit: 10
      interval: '1 minute'

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
