parameters: { }

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $webOrigin: '%env(WEB_ORIGIN)%'
      $packageStoragePath: '%env(PACKAGE_STORAGE_PATH)%'
      $chainId: '%env(int:CHAIN_ID)%'
      $sessionCookieName: '%env(SESSION_COOKIE_NAME)%'
      $sessionSameSite: '%env(SESSION_SAME_SITE)%'
      $emailEncryptionKey: '%env(EMAIL_ENCRYPTION_KEY)%'
      $emailLookupKey: '%env(EMAIL_LOOKUP_KEY)%'
      $otpHmacKey: '%env(OTP_HMAC_KEY)%'
      $emailProvider: '%env(EMAIL_PROVIDER)%'
      $resendApiKey: '%env(RESEND_API_KEY)%'
      $resendWebhookSecret: '%env(RESEND_WEBHOOK_SECRET)%'
      $emailFrom: '%env(EMAIL_FROM)%'
      $recoveryPrivateKey: '%env(RECOVERY_PRIVATE_KEY)%'
      $rpcUrl: '%env(BASE_RPC_URL)%'
      $rpcFallbackUrl: '%env(BASE_RPC_FALLBACK_URL)%'
      $contractAddress: '%env(GIBYEOL_CONTRACT_ADDRESS)%'
      $unlockAt: '%env(int:UNLOCK_AT)%'
      $contractDeploymentBlock: '%env(int:CONTRACT_DEPLOYMENT_BLOCK)%'
      $safeBlockConfirmations: '%env(int:SAFE_BLOCK_CONFIRMATIONS)%'
      $orphanMinAgeSeconds: '%env(int:ORPHAN_MIN_AGE_SECONDS)%'

  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'

  App\Http\HttpClient: '@App\Http\CurlHttpClient'
  App\Auth\SiweVerifier: '@App\Auth\RpcSiweVerifier'
  App\Email\EmailSender: '@App\Email\ConfiguredEmailSender'
  App\Recovery\MailboxKeyVerifier: '@App\Recovery\RpcMailboxKeyVerifier'
  App\Operations\ChainIndex: '@App\Operations\RpcChainIndex'
