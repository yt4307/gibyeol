name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      - name: pnpm 준비
        uses: pnpm/action-setup@v4

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 전체 품질 검증
        run: pnpm verify
