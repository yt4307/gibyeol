name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 전체 이력 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 비밀정보 검사
        uses: gitleaks/gitleaks-action@v2
