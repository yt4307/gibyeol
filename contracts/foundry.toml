[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 32 }

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 64 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
